{% comment %}
Client-facing, so light and plain rather than the app's dark internal emails:
this lands next to the client's own business mail and should read like a note
from their agency, not a system alert. Table layout and inline styles only —
mail clients strip <style> and have no flexbox.
{% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5f4;padding:32px 12px;font-family:Segoe UI,Helvetica,Arial,sans-serif">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px">
      <tr><td style="padding:0 4px 14px;font-size:14px;font-weight:700;color:#141a17">{{ agency_name }}</td></tr>
    </table>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e0e3e2;border-radius:16px">
      <tr><td style="padding:30px 32px 6px">
        <div style="display:inline-block;padding:5px 11px;border-radius:999px;background:#fdf0d6;color:#915700;font-size:12px;font-weight:700">
          {% if reminder %}Reminder &middot; waiting for your approval{% elif approval.version > 1 %}Updated &middot; version {{ approval.version }}{% else %}Needs your approval{% endif %}
        </div>
        <h1 style="margin:16px 0 8px;font-size:22px;line-height:1.3;color:#141a17;font-weight:800">{{ activity.title }}</h1>
        <p style="margin:0;color:#4c5450;font-size:15px;line-height:1.6">
          Hi {{ reviewer.first_name }},
          {% if reminder %}just a nudge — this is still waiting for your go-ahead{% elif approval.version > 1 %}we've made the changes and this is ready for another look{% else %}this is ready for your review{% endif %}{% if asker %} from {{ asker.get_full_name|default:asker.username }}{% endif %} at {{ agency_name }}.
          Nothing goes live until you approve it.
        </p>
      </td></tr>

      {% if approval.message %}
      <tr><td style="padding:18px 32px 0">
        <div style="background:#dff5ea;border-radius:12px;padding:14px 16px;color:#141a17;font-size:14.5px;line-height:1.6">{{ approval.message|linebreaksbr }}</div>
      </td></tr>
      {% endif %}

      <tr><td style="padding:20px 32px 4px">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:13.5px;color:#6e7672;background:#f8f9f8;border:1px solid #ebedec;border-radius:12px">
          <tr><td style="padding:12px 16px 4px">What</td>
              <td align="right" style="padding:12px 16px 4px;color:#141a17;font-weight:600">{{ activity.get_kind_display }}{% if activity.platform %} &middot; {{ activity.get_platform_display }}{% endif %}</td></tr>
          <tr><td style="padding:4px 16px">Planned for</td>
              <td align="right" style="padding:4px 16px;color:#141a17;font-weight:600">{{ activity.date|date:"D, j M Y" }}{% if activity.time %}, {{ activity.time|time:"g:i A" }}{% endif %}</td></tr>
          {% if assets %}
          <tr><td style="padding:4px 16px">To review</td>
              <td align="right" style="padding:4px 16px;color:#141a17;font-weight:600">{% if approval.content %}Copy{% if assets %} + {% endif %}{% endif %}{{ assets|length }} file{{ assets|length|pluralize }} or link{{ assets|length|pluralize }}</td></tr>
          {% endif %}
          {% if approval.respond_by %}
          <tr><td style="padding:4px 16px 12px">Please reply by</td>
              <td align="right" style="padding:4px 16px 12px;color:#915700;font-weight:700">{{ approval.respond_by|date:"D, j M" }}</td></tr>
          {% else %}
          <tr><td colspan="2" style="padding:0 0 8px"></td></tr>
          {% endif %}
        </table>
      </td></tr>

      {% if url %}
      <tr><td style="padding:24px 32px 8px">
        <a href="{{ url }}" style="display:inline-block;background:#00795b;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;padding:13px 26px;border-radius:10px">Review &amp; approve</a>
      </td></tr>
      {% endif %}

      <tr><td style="padding:14px 32px 28px">
        <p style="margin:0;color:#6e7672;font-size:12.5px;line-height:1.6">
          &#006e52; This link is only for you ({{ reviewer.email }}). The first time you open it on a device we'll email you a
          short code to confirm it's you — so please don't forward it. Reply to this email if you have questions.
        </p>
      </td></tr>
    </table>
    <div style="max-width:560px;margin-top:14px;color:#8f9592;font-size:11.5px;line-height:1.6">
      Sent by {{ agency_name }} for {{ client.name }}.
    </div>
  </td></tr>
</table>
