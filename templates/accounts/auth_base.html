{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Sign in{% endblock %} · Livo OS</title>
<link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
<link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-body">
<div class="auth-card">
  <img src="{% static 'img/livo-logo.png' %}" alt="Livo Digital">
  <div class="sub">{% block subtitle %}Sign in to the agency console.{% endblock %}</div>
  {% if messages %}{% for m in messages %}
    <div class="{% if m.tags == 'success' %}note{% else %}err{% endif %}">{{ m }}</div>
  {% endfor %}{% endif %}
  {% block card %}{% endblock %}
</div>
<script>
// Show/hide for password fields. The button is added by script rather than
// living in the markup so that with JS off the field is a plain password box
// instead of a dead icon.
(function () {
  var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 6.7A9.7 9.7 0 0 1 12 6.6c7 0 10.5 6.5 10.5 6.5a18 18 0 0 1-3.3 4.2M6.3 8.3A18 18 0 0 0 1.5 13S5 19.5 12 19.5a9.9 9.9 0 0 0 4-.8"/><path d="M9.9 10.4a3.2 3.2 0 0 0 4.3 4.5"/><line x1="3" y1="3" x2="21" y2="21"/></svg>';

  document.querySelectorAll('input[type="password"]').forEach(function (input) {
    var wrap = document.createElement('div');
    wrap.className = 'pw-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    var button = document.createElement('button');
    button.type = 'button';           // inside a form, a bare button submits it
    button.className = 'pw-toggle';
    button.innerHTML = EYE;
    button.setAttribute('aria-label', 'Show password');
    button.setAttribute('aria-pressed', 'false');
    button.title = 'Show password';
    wrap.appendChild(button);

    button.addEventListener('click', function () {
      var shown = input.type === 'text';
      input.type = shown ? 'password' : 'text';
      button.innerHTML = shown ? EYE : EYE_OFF;
      button.setAttribute('aria-pressed', shown ? 'false' : 'true');
      var label = shown ? 'Show password' : 'Hide password';
      button.setAttribute('aria-label', label);
      button.title = label;
      // Toggling type moves the caret to the start in most browsers.
      var end = input.value.length;
      input.focus();
      try { input.setSelectionRange(end, end); } catch (e) {}
    });
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
